<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<title>Guarana</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<!-- Boot splash: plain markup so the first paint is the rainforest night, not a white window.
     The seed, still closed: a red guarana fruit with its leaf and a seam where it will split open.
     main.ts fades it out once the first screen has mounted. -->
<div id="boot" class="boot">
  <svg class="boot-mark" viewBox="0 0 200 200" width="120" height="120" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="boot-shell" cx="0.66" cy="0.3" r="0.8">
        <stop offset="0" stop-color="#ff9a52"/><stop offset="0.3" stop-color="#e64422"/><stop offset="0.68" stop-color="#a8190f"/><stop offset="1" stop-color="#4e0906"/>
      </radialGradient>
      <linearGradient id="boot-fade" x1="14" y1="0" x2="78" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <mask id="boot-streaks" maskUnits="userSpaceOnUse" x="-10" y="-10" width="220" height="220">
        <rect x="-10" y="-10" width="220" height="220" fill="url(#boot-fade)"/>
        <path d="M-6 75.2H72M-6 124.8H72" stroke="#000" stroke-width="6.6" stroke-linecap="round"/>
      </mask>
    </defs>
    <path d="M14 100L72.77 51.98A62 62 0 1 1 72.77 148.02Z" fill="url(#boot-shell)" mask="url(#boot-streaks)"/>
    <path d="M66 100Q112 110 158 100" fill="none" stroke="#3a0604" stroke-width="3" stroke-linecap="round"/>
    <path d="M117.58 41.72Q120.68 12.27 150.13 7.62Q148.58 37.07 117.58 41.72Z" fill="#3CCF7E"/>
  </svg>
  <!-- Filled by main.ts while get_state waits for the first-run install of the bundled build. -->
  <p class="boot-status" role="status"></p>
</div>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p class="noscript">Guarana Launcher needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070b14">
<title>Guarana</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<!-- Boot splash: plain markup so the first paint is the night stage, not a white window.
     main.ts fades it out once the first screen has mounted. -->
<div id="boot" class="boot">
  <svg class="boot-mark" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="boot-fill" x1="22" y1="19" x2="48" y2="53" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFC94A"/>
        <stop offset="1" stop-color="#F2851A"/>
      </linearGradient>
      <mask id="boot-streaks" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
        <rect width="64" height="64" fill="#fff"/>
        <path d="M-4 29.2H29M-4 42.8H29" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
      </mask>
    </defs>
    <path d="M4 36L26.97 21.6A17 17 0 1 1 26.97 50.4Z" fill="url(#boot-fill)" mask="url(#boot-streaks)"/>
    <path d="M37.5 20Q38.5 10.5 48 9Q47.5 18.5 37.5 20Z" fill="#3CCF7E"/>
    <path d="M53.93 22.98A17 17 0 0 1 53.93 49.02" fill="none" stroke="#F59E0B" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <!-- Filled by main.ts while get_state waits for the first-run install of the bundled build. -->
  <p class="boot-status" role="status"></p>
</div>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p class="noscript">Guarana Launcher needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.ts"></script>
</body>
</html>

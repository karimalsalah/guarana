[package]
name = "guarana-launcher"
version = "0.1.0"
description = "Guarana Launcher: installer, first-run setup, launcher, updater and doctor for the Guarana emulator"
authors = ["Guarana contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/karimalsalah/guarana"
edition = "2021"
rust-version = "1.80"
publish = false

[[bin]]
name = "guarana-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
sysinfo = { version = "0.30", default-features = false }
log = { version = "0.4", features = ["std"] }
percent-encoding = "2"
url = "2"
gilrs = "0.11"
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

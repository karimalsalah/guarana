name: New Issue (Developers Only)
description: A blank issue for contributors and maintainers. Bugs, device results, performance ideas and agent tasks have their own forms.
body:
  - type: markdown
    attributes:
      value: |
        **For contributors and maintainers.** Reporting a bug, a device result, a performance idea or an agent task? Use that form instead: it asks for what we need. A maintainer may move or close an issue filed here that belongs in another form.
  - type: textarea
    attributes:
      label: "Issue"

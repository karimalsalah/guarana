name: Copilot Setup Steps

# The environment of GitHub Copilot cloud agent in this repository. Copilot runs the job named
# `copilot-setup-steps` from this file on the default branch before it starts, and uses only its
# steps, permissions, runs-on, services, snapshot and timeout-minutes (at most 59). A push or pull
# request that changes this file runs the same job as a check.
#
# The agent can run the Python tool tests here without a build (AGENTS.md, "Verify a change"). The
# C++ build takes longer than the agent's time limit, so CI builds and tests its pull requests.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # "Upstream first": the `upstream` branch mirrors zortos293/Lichii nx2, so the agent can
      # search it for an existing fix (git log origin/upstream -- <path>) before writing its own.
      - name: Fetch the upstream mirror branch
        run: git fetch --no-tags --depth=200 origin +refs/heads/upstream:refs/remotes/origin/upstream

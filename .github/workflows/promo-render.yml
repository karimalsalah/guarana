name: promo-render

# Renders the 20-second cinematic promo in site/promo/ and uploads it as an artifact:
#   guarana-promo-vertical.mp4 (1080x1920), -landscape.mp4 (1920x1080), -square.mp4 (1080x1080), all 60 fps;
#   guarana-promo-vertical-15s.mp4 (the 15 s TikTok and Shorts cut); guarana-promo-teaser.mp4 and .gif (6 s loop);
#   guarana-promo-thumbnail.jpg and .png (1280x720); one poster PNG per format; the soundtrack as WAV files.
# render.mjs sets every frame with renderAt(t) and captures it (the page averages 4 sub-frames per frame
# for real motion blur), so the result does not depend on how fast the runner is. score.mjs synthesizes
# the original soundtrack from site/promo/cues.json, the same cue list the picture uses.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/promo/**"
      - "site/assets/promo/**"
      - .github/workflows/promo-render.yml

permissions:
  contents: read

concurrency:
  group: promo-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render the promo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the promo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            site/promo
            site/assets

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The page names Inter and JetBrains Mono first in its font stacks. Without them it falls
      # back to the system fonts, and headlines still fit (promo.js sizes them to their column).
      - name: Install fonts
        run: |
          sudo apt-get update
          for font in fonts-inter fonts-jetbrains-mono; do
            sudo apt-get install -y --no-install-recommends "$font" || echo "::warning::$font is not available; the render uses a fallback font"
          done

      # Playwright goes into a folder outside the checkout, so nothing lands in site/ (Pages
      # publishes it). npx runs from the same folder, so the browser matches the package.
      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright@1 install --with-deps chromium

      - name: Check ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1

      - name: Smoke test, one frame per format
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: node site/promo/render.mjs --driver playwright --times 5.4 --frames-only --workers 1 --out "$RUNNER_TEMP/smoke"

      # Text that is clipped, outside the safe area of its format, or overlapping other text fails the job.
      - name: Layout check
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: node site/promo/render.mjs --driver playwright --check-layout

      # The score has to stay under -1 dBFS; the AAC encode adds a little on top of the WAV.
      - name: Score peak check
        run: |
          node site/promo/score.mjs --out "$RUNNER_TEMP/score"
          peak=$(ffmpeg -hide_banner -i "$RUNNER_TEMP/score/guarana-score.wav" -af volumedetect -f null - 2>&1 | sed -n 's/.*max_volume: \(-\{0,1\}[0-9.]*\) dB.*/\1/p')
          echo "peak: $peak dBFS"
          awk -v p="$peak" 'BEGIN { exit !(p < -1.5) }'

      - name: Render every format, the cuts, the thumbnail and the score
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: node site/promo/render.mjs --driver playwright --workers 4 --timing --out "$RUNNER_TEMP/promo"

      - name: Check the files
        run: |
          cd "$RUNNER_TEMP/promo"
          for f in guarana-promo-*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=profile,pix_fmt,width,height,r_frame_rate,color_space:format=duration -of csv=p=0 "$f" | tr '\n' ' '
            echo "$f"
            ffmpeg -hide_banner -i "$f" -af volumedetect -vn -f null - 2>&1 | grep max_volume
          done
          ls -l

      - name: Upload the promo
        uses: actions/upload-artifact@v7
        with:
          name: guarana-promo-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/promo/*.mp4
            ${{ runner.temp }}/promo/*.gif
            ${{ runner.temp }}/promo/*.png
            ${{ runner.temp }}/promo/*.jpg
            ${{ runner.temp }}/promo/audio/*.wav
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

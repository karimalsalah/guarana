name: pages

# Publishes the site/ folder to GitHub Pages when it changes on main. Needs Settings > Pages >
# Build and deployment > Source: GitHub Actions. Before the upload, tools/ci/build_llms_full.py
# rebuilds site/llms-full.txt from AGENTS.md, docs/switches.md, CONTRIBUTING.md and LEGAL.md, so a
# web chat can take that one URL as its whole context; the pushed copy only makes local links work.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - AGENTS.md
      - CONTRIBUTING.md
      - LEGAL.md
      - docs/switches.md
      - tools/ci/build_llms_full.py
      - tools/ci/llms-site-facts.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            site
            docs
            tools/ci

      - name: Build site/llms-full.txt from the repository
        run: python3 -I tools/ci/build_llms_full.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Files whose names start with a dot are left out of the upload.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: release-binaries

# Builds every platform and publishes the binaries as a GitHub release:
# - a vX.Y.Z or vX.Y.Z-<pre-release> tag pushed by a maintainer: a release named after the tag,
#   with its CHANGELOG.md section as the notes (docs/LANES.md, "Releases");
# - nightly.yml calls it for the rolling "nightly" pre-release of main;
# - by hand: an existing tag again (its release gets the new files), or any branch as workflow
#   artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build again; empty builds the selected branch or tag
        type: string
        default: ""
      publish_release:
        description: Publish the tag's binaries as its GitHub release (branches are never published)
        type: boolean
        default: true
  workflow_call:
    inputs:
      channel:
        description: Only "nightly"
        type: string
        required: true
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  # Clang major the Linux PGO build uses, from apt.llvm.org. A profile is written by a current clang
  # and an older reader refuses it, so this has to stay at or above whatever produced
  # eglantine.profdata; bump it when a refreshed profile needs a newer LLVM.
  PGO_LLVM_VERSION: "23"
  # Release files are named <APP>-<version>-<platform>.<ext>; APP_NAME titles the release.
  APP: "guarana"
  APP_NAME: "Guarana"

# A running build is never cancelled: it finishes and publishes. Another run of the same tag or
# channel meanwhile waits for it.
concurrency:
  group: release-binaries-${{ inputs.channel || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      refspec: ${{ steps.plan.outputs.refspec }}
      build_tag: ${{ steps.plan.outputs.build_tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      # channel: release (a vX.Y.Z tag), nightly (from nightly.yml) or test (a branch, never
      # published). version names the files: X.Y.Z[-pre] for a tag, "nightly", or test-<commit>.
      - name: Decide what to build
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALL_CHANNEL: ${{ inputs.channel }}
          CALL_REF: ${{ inputs.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          CALL_CHANNEL=${CALL_CHANNEL:-} CALL_REF=${CALL_REF:-}
          DISPATCH_TAG=${DISPATCH_TAG:-} DISPATCH_PUBLISH=${DISPATCH_PUBLISH:-}
          prerelease=false
          if [ "$CALL_CHANNEL" = nightly ]; then
            channel=nightly tag=nightly version=nightly sha=$CALL_REF refspec=main
            build_tag=nightly publish=true prerelease=true
          elif [ -n "$DISPATCH_TAG" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=release
            tag=${DISPATCH_TAG:-$GITHUB_REF_NAME}
            re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
            if ! [[ "$tag" =~ $re ]]; then
              echo "::error::$tag is not a release tag: use vX.Y.Z or vX.Y.Z-rcN (docs/LANES.md)"
              exit 1
            fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            version=${tag#v} refspec=$tag build_tag=$tag
            case "$version" in *-*) prerelease=true ;; esac
            publish=true
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DISPATCH_PUBLISH" != true ]; then
              publish=false
            fi
          elif [ -n "$CALL_CHANNEL" ]; then
            echo "::error::Unknown channel $CALL_CHANNEL"
            exit 1
          else
            channel=test tag= sha=$GITHUB_SHA version="test-${GITHUB_SHA::7}" refspec=$GITHUB_REF_NAME
            build_tag= publish=false
          fi
          {
            echo "channel=$channel"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "refspec=$refspec"
            echo "build_tag=$build_tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Building $channel $version from $sha (publish: $publish)"

      # Root files (CHANGELOG.md) and tools/ci at the tagged commit.
      - name: Check out CHANGELOG.md
        if: steps.plan.outputs.channel == 'release'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci

      # Checked before anything is built: a tag without notes fails here, not after the builds.
      - name: Write the release notes
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p notes
          blank() { [ -z "$(tr -d '[:space:]' <<< "$1")" ]; }
          if [ "$CHANNEL" = release ]; then
            # vX.Y.Z-rcN uses its own section when CHANGELOG.md has one, else the X.Y.Z section.
            section=$(bash tools/ci/changelog-section.sh "$VERSION")
            if blank "$section" && [ "$VERSION" != "${VERSION%%-*}" ]; then
              section=$(bash tools/ci/changelog-section.sh "${VERSION%%-*}")
            fi
            if blank "$section"; then
              want="'## [$VERSION]'"
              if [ "$VERSION" != "${VERSION%%-*}" ]; then want+=" or '## [${VERSION%%-*}]'"; fi
              echo "::error file=CHANGELOG.md::CHANGELOG.md at $TAG has no non-empty $want section. Add it, move the tag to that commit and push the tag again."
              exit 1
            fi
            if [ "$VERSION" != "${VERSION%%-*}" ]; then
              printf '> **Pre-release of %s.** Test it and report problems before the final release.\n\n' "${VERSION%%-*}"
            fi > notes/changes.md
            printf '%s\n' "$section" >> notes/changes.md
          else
            previous=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2> /dev/null) || previous=
            {
              printf 'Automatic build of `main` at %s (%s UTC).\n\n' "$SHA" "$(date -u '+%F %H:%M')"
              printf '**Not a release.** Nightly builds change every day and can break. Report problems with the commit above.\n\n'
              if [ -n "$previous" ] && [ "$previous" != "$SHA" ]; then
                printf '## Changes since the previous nightly\n\n'
                changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$SHA" \
                  --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"') ||
                  changes="- The previous nightly ($previous) could not be compared with this one."
                printf '%s\n' "$changes" | tail -n 100
                printf '\n'
              fi
            } > notes/changes.md
          fi
          cat notes/changes.md

      - name: Upload the release notes
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/changes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      # Baked into the binaries. Not build-N: CMakeModules/GenerateSCMRev.cmake and the update
      # checker only treat build-N as a published build, and the checker asks zortos293/Lichii.
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
      NIGHTLY_BUILD: ${{ needs.prepare.outputs.channel == 'nightly' && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        # march: the x86-64 packages target x86-64-v3 (AVX2: Intel Haswell, AMD Zen and newer), as
        # scripts/build-windows.ps1 and scripts/build-linux.sh build them; remove it from a row to
        # build for any x86-64 CPU.
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            march: x86-64-v3
          # The Linux -pgo builds are the same programs compiled by clang against the repo's
          # eglantine.profdata. Eden's profile (Eden-CI/PGO) comes from Switch 1 games: with it Mario
          # Kart World ran at about half the speed of the normal build, with eglantine.profdata at
          # about the same speed. Both Windows builds are clang-cl with ThinLTO; windows-x86_64-pgo
          # adds lichii-windows.profdata, an MSVC-ABI profile trained on Ocarina of Time (see
          # docs/CI.md). MSVC still builds for development.
          - platform: linux-x86_64-pgo
            runner: ubuntu-24.04
            pgo: true
            march: x86-64-v3
          - platform: windows-x86_64
            runner: windows-2022
            march: x86-64-v3
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            profile: lichii-windows.profdata
            march: x86-64-v3
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-aarch64-pgo
            runner: ubuntu-24.04-arm
            pgo: true
          - platform: macos-arm64
            runner: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # GetSCMRev (externals/cmake-modules) reads these files instead of asking git: a tag's build
      # reports the tag as its version, a nightly reports main and the commit.
      - name: Write version files
        shell: bash
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REFSPEC: ${{ needs.prepare.outputs.refspec }}
        run: |
          set -euo pipefail
          printf '%s' "$BUILD_SHA" > GIT-COMMIT
          printf '%s' "$REFSPEC" > GIT-REFSPEC
          printf '%s' "${TAG:-$REFSPEC}" > GIT-TAG
          if [ "$CHANNEL" = release ]; then printf '%s' "$TAG" > GIT-RELEASE; fi

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache llvm python3-zstandard \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # The packages docs/Deps.md lists for macOS, plus ccache. The runner image can carry a
      # freetype 2.15.0 bottle that links /usr/lib/libhvf.dylib, which macOS has only from 15.4, so
      # the bundled copy stopped the app from starting on 15.0 to 15.3 (#892). Homebrew rebuilt the
      # Sequoia bottle without HVF (homebrew-core 85373af); a rebuilt bottle keeps the version
      # number, so only an updated tap and an explicit reinstall replace the image's copy.
      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache
          freetype="$(brew --prefix freetype)/lib/libfreetype.6.dylib"
          if otool -L "$freetype" | grep -F /usr/lib/libhvf.dylib > /dev/null; then
            brew update --quiet
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew reinstall freetype
            if otool -L "$freetype" | grep -F /usr/lib/libhvf.dylib; then
              echo "::error::$freetype still links libhvf.dylib, which macOS 15.0 to 15.3 lack"
              exit 1
            fi
          fi

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install Qt on Linux ARM64
        if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there.
      - name: Install clang for PGO
        if: startsWith(matrix.platform, 'linux') && matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # The profiles are in the source tree, where the Linux and Windows configure steps read them.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile || 'eglantine.profdata' }}"

      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # ccache does not handle MSVC-style command lines well, so the clang-cl job uses sccache. The
      # other jobs use ccache, which CMake enables through USE_CCACHE
      # (externals/cmake-modules/UseCcache.cmake).
      - name: Install sccache on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-

      # The update checker stays off: it asks zortos293/Lichii for releases (GenerateSCMRev.cmake)
      # and understands only build-N tags, so it could offer upstream's builds to this fork's users.
      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DLICHII_TESTS=OFF
            -DLICHII_CMD=ON
            -DLICHII_ROOM=OFF
            -DLICHII_ROOM_STANDALONE=OFF
            -DLICHII_USE_BUNDLED_QT=OFF
            -DENABLE_QT_TRANSLATION=ON
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DLICHII_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=OFF
            "-DLICHII_BUILD_TAG=$BUILD_TAG"
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
            "-DNIGHTLY_BUILD=$NIGHTLY_BUILD"
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          cflags=""
          if [ -n '${{ matrix.march }}' ]; then cflags="-march=${{ matrix.march }}"; fi
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            cflags+=" -fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
            )
          fi
          if [ -n "$cflags" ]; then
            flags+=("-DCMAKE_C_FLAGS=$cflags" "-DCMAKE_CXX_FLAGS=$cflags")
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in the ThinLTO build. clang-cl 22 reads LLVM's indexed
      # profile format 13, so the profile must come from the LLVM that tools/windows installs.
      - name: Configure Windows
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          # /Z7 keeps debug info in the objects (sccache caches it); the linker writes lichii.pdb,
          # published as a separate symbols archive so crash dumps from users can be symbolized.
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin /Z7"
          if [ -n '${{ matrix.march }}' ]; then flags+=" -march=${{ matrix.march }}"; fi
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            "-DLICHII_BUILD_TAG=$BUILD_TAG" \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            "-DNIGHTLY_BUILD=$NIGHTLY_BUILD" \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF /OPT:ICF"

      - name: Configure macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            "-DLICHII_BUILD_TAG=$BUILD_TAG" \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            "-DNIGHTLY_BUILD=$NIGHTLY_BUILD" \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      # lichii-updater exists only with ENABLE_UPDATE_CHECKER (src/CMakeLists.txt), which is off.
      - name: Build
        shell: bash
        run: |
          if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
          cmake --build build/release --target lichii lichii-cmd --parallel
          if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi

      - name: Stop sccache on Windows
        if: always() && startsWith(matrix.platform, 'windows') && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # fsr4-vk, the community Vulkan port of FSR 4 that the x86-64 Linux packages ship
      # (tools/fsr4-vk/build.sh pins its commit and AMD's DLL it is built from). The build's inputs
      # are all in the script, so its output is cached by the script's hash. Its shader conversion
      # fails its own asset check on arm64 hosts, so the aarch64 packages go without it.
      - name: Restore fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64')
        id: fsr4-vk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/fsr4-vk
          key: fsr4-vk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fsr4-vk/build.sh') }}

      - name: Build fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64') && steps.fsr4-vk.outputs.cache-hit != 'true'
        shell: bash
        run: bash tools/fsr4-vk/build.sh "$RUNNER_TEMP/fsr4-vk-work" "$RUNNER_TEMP/fsr4-vk"

      - name: Save fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64') && steps.fsr4-vk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/fsr4-vk
          key: ${{ steps.fsr4-vk.outputs.cache-primary-key }}

      # Both Linux packages are self-contained: linuxdeploy bundles every library the two programs
      # need except the base system ones (glibc, X11/Wayland client libraries, the GPU driver and
      # Vulkan loader), and its Qt plugin adds the Qt libraries and platform plugins. The AppImage
      # packs that folder into one file; the tar.gz holds the same folder for systems without FUSE,
      # with lichii and eden-cli links at its top. Both run on glibc 2.39+ systems. A tar.gz of the
      # bare programs needed the Qt 6.8 they were built against installed system-wide (#901).
      # Files are named lichii-<commit>-<platform> here; the publish job gives them release names.
      - name: Package Linux AppImage and tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          test -x build/release/bin/eden-cli
          strip build/release/bin/lichii build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)   # aarch64 or x86_64
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon io.github.zortos293.lichii.
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata: the release version plus the commit.
          export LDAI_VERSION="${VERSION}-${BUILD_SHA::7}"
          export LDAI_OUTPUT="lichii-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/bin AppDir/usr/share/licenses
          cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          # The emulator loads fsr4-vk from <exe dir>/../lib (FfxRuntime::PortLibrary).
          fsr4=amd_fidelityfx_upscaler_vk.so
          fsr4_library=()
          if [ "$arch" = x86_64 ]; then
            cp -r "$RUNNER_TEMP/fsr4-vk/licenses/fsr4-vk" AppDir/usr/share/licenses/
            fsr4_library=(--library "$RUNNER_TEMP/fsr4-vk/$fsr4")
          fi
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --executable build/release/bin/eden-cli \
            "${fsr4_library[@]}" \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"
          test -f AppDir/usr/bin/qt.conf
          mv AppDir lichii
          ln -s usr/bin/lichii lichii/lichii
          ln -s usr/bin/eden-cli lichii/eden-cli
          tar -czf "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" lichii
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"
          # Both x86-64 packages must carry fsr4-vk and its licences.
          if [ "$arch" = x86_64 ]; then
            test "$(tar -tzf "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" |
              grep -cFx -e "lichii/usr/lib/$fsr4" -e lichii/usr/share/licenses/fsr4-vk/LICENSE \
                -e lichii/usr/share/licenses/fsr4-vk/AMD-FidelityFX-SDK-license.md)" = 3
            extract="$RUNNER_TEMP/appimage-check"
            mkdir -p "$extract"
            (cd "$extract" &&
              "$GITHUB_WORKSPACE/$LDAI_OUTPUT" --appimage-extract "usr/lib/$fsr4" > /dev/null)
            cmp "$extract/squashfs-root/usr/lib/$fsr4" "lichii/usr/lib/$fsr4"
            nm -D --defined-only "lichii/usr/lib/$fsr4" | grep -w ffxCreateContext
          fi

      - name: Package Windows binary
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          New-Item -ItemType Directory -Force build/release/symbols | Out-Null
          Get-ChildItem build/release/bin -Filter *.pdb | Move-Item -Destination build/release/symbols

      # A self-contained app bundle: macdeployqt copies Qt and every other Homebrew library both
      # programs load into the bundle, then the leftover Homebrew and build-tree search paths are
      # removed so a machine with Homebrew still uses the bundled copies. Ad-hoc signed, not
      # notarized.
      - name: Package macOS app
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/lichii.app
          test -x "$app/Contents/MacOS/lichii"
          test -x build/release/bin/eden-cli
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E -e '^/(opt/homebrew|usr/local)/' -e "^$GITHUB_WORKSPACE/" || true; } |
              while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          # Libraries that load their dependencies through @rpath find them in the bundle.
          for program in lichii eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E -e '^\s+/(opt/homebrew|usr/local)/' -e "^\s+$GITHUB_WORKSPACE/"
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E -e '^/(opt/homebrew|usr/local)/' -e "^$GITHUB_WORKSPACE/"
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # dyld refuses to start the app when a linked system library is missing, and libhvf.dylib
          # ships only with macOS 15.4 and later, newer than the 15.0 deployment target (#892).
          hvf=$(for binary in $binaries; do
            otool -L "$binary" | grep -F /usr/lib/libhvf.dylib > /dev/null && echo "$binary"
          done || true)
          if [ -n "$hvf" ]; then
            echo "::error::these link /usr/lib/libhvf.dylib, which macOS 15.0 to 15.3 lack: $hvf"
            exit 1
          fi
          # macdeployqt invalidates the signatures. The programs get the entitlements when the
          # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          # Also ship a .dmg (drag lichii.app onto Applications).
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/lichii.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$dmgdir" -ov -format UDZO \
            "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      # Debug symbols for crash reports: llvm-symbolizer --obj=lichii.exe with lichii.pdb next to it.
      - name: Upload Windows symbols
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}-symbols-${{ github.sha }}
          path: build/release/symbols/
          if-no-files-found: warn
          retention-days: 7

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lichii-${{ github.sha }}-${{ matrix.platform }}.tar.gz
            lichii-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lichii-${{ github.sha }}-${{ matrix.platform }}.zip
            lichii-${{ github.sha }}-${{ matrix.platform }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publishes every platform's files, SHA256SUMS.txt and the notes once every platform built: a
  # tag's release (a pre-release for vX.Y.Z-<pre>), or the rolling nightly pre-release.
  publish:
    name: Publish release
    needs: [prepare, build]
    # Publishes what built: one platform failing (say a Linux toolchain break) does not hold back the
    # rest. A release without a Windows binary is refused below.
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: lichii-*-${{ github.sha }}
          path: artifacts

      - name: Require a Windows binary
        shell: bash
        run: |
          if ! compgen -G "artifacts/lichii-windows-*" > /dev/null; then
            echo "::error::No Windows binary was built; not publishing"
            exit 1
          fi
          echo "Built platforms:"; ls artifacts

      - name: Download the release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes

      # The licence texts travel inside every zip (GPL-3.0: binaries ship with the licence).
      - name: Check out the licence texts
        uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: |
            LICENSE.txt
            LEGAL.md
            LICENSES
          sparse-checkout-cone-mode: false

      # lichii-<commit>-<platform>.<ext> becomes <APP>-<version>-<platform>.<ext>; each Windows bin
      # folder is zipped as <APP>-<version>-<platform>.zip.
      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")            # lichii-<platform>-<commit>
            platform=${name#lichii-}
            platform=${platform%-"$GITHUB_SHA"}
            if compgen -G "$artifact*.AppImage" > /dev/null || compgen -G "$artifact*.dmg" > /dev/null; then
              for file in "$artifact"*; do
                base=$(basename "$file")
                cp "$file" "dist/$APP-$VERSION-${base#lichii-"$GITHUB_SHA"-}"
              done
            else
              cp src/LICENSE.txt src/LEGAL.md "$artifact"
              cp -r src/LICENSES "$artifact"
              printf '%s %s\nSource code: %s/%s/tree/%s\nLicence: GPL-3.0-or-later (LICENSE.txt); other components: LICENSES/.\nNo keys, firmware or games are included or provided; see LEGAL.md.\n' \
                "$APP" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$artifact/SOURCE.txt"
              (cd "$artifact" && zip -qr "$GITHUB_WORKSPACE/dist/$APP-$VERSION-$platform.zip" .)
            fi
          done
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          ls -la dist
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          asset() { printf '%s-%s-%s' "$APP" "$VERSION" "$1"; }
          link() { if [ -e "dist/$2" ]; then printf '[%s](%s/%s)' "$1" "$base" "$2"; fi; return 0; }
          pair() {
            local a b
            a=$(link "$1" "$2")
            b=$(link "$3" "$4")
            if [ -n "$a" ] && [ -n "$b" ]; then printf '%s · %s' "$a" "$b"; else printf '%s%s' "$a" "$b"; fi
          }
          linux() { pair AppImage "$(asset "$1").AppImage" tar.gz "$(asset "$1").tar.gz"; }
          {
            cat notes/changes.md
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Standard | PGO (recommended) |"
            echo "| --- | --- | --- |"
            echo "| Windows x86_64 | $(link zip "$(asset windows-x86_64).zip") | $(link zip "$(asset windows-x86_64-pgo).zip") |"
            echo "| Linux x86_64 | $(linux linux-x86_64) | $(linux linux-x86_64-pgo) |"
            echo "| Linux aarch64 | $(linux linux-aarch64) | $(linux linux-aarch64-pgo) |"
            echo "| macOS arm64 | $(pair zip "$(asset macos-arm64).zip" dmg "$(asset macos-arm64).dmg") | |"
            echo
            cat <<'EOF'
          - **Windows**: extract the whole zip into a folder you can write to and run `lichii.exe` (`eden-cli.exe` from a terminal). Both are clang-cl ThinLTO builds; the PGO zip adds a profile trained on Ocarina of Time, so other games gain less.
          - **Linux**: make the AppImage executable (`chmod +x`) and run it. The tar.gz holds the same files for systems without FUSE: extract it and run `lichii/lichii`. Both need glibc 2.39 or newer. The PGO builds use clang with Eglantine's profile.
          - **macOS** 15 or newer, Apple Silicon. Not notarized: right-click and choose Open the first time, or run `xattr -dr com.apple.quarantine lichii.app`.
          - **Checksums**: `SHA256SUMS.txt`. Check with `sha256sum -c SHA256SUMS.txt` (Linux), `shasum -a 256 -c SHA256SUMS.txt` (macOS) or `Get-FileHash <file>` (PowerShell).

          No keys, firmware or games are included or provided. Dump your own from hardware you own; see LEGAL.md.
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = nightly ]; then
            # Rolling: the previous nightly and its tag go, and the new tag points at this commit.
            gh release delete nightly --cleanup-tag --yes 2> /dev/null || true
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" 2> /dev/null || true
            gh release create nightly dist/* --target "$BUILD_SHA" --prerelease \
              --title "$APP_NAME nightly $(date -u +%F) (${BUILD_SHA::7})" --notes-file release-notes.md
          elif gh release view "$TAG" > /dev/null 2>&1; then
            # A rebuild of a published tag replaces its files and notes.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --verify-tag --title "$APP_NAME $TAG" \
              --notes-file release-notes.md "${flags[@]}"
          fi

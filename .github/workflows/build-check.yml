name: build-check

on:
  pull_request:
  # GitHub's merge queue, once it is turned on, runs these checks on the queued merge commit
  # (docs/LANES.md, "Merging"). The jobs below need no change for it: with no pull request
  # number every build runs, as for a push.
  merge_group:
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
      - "exp/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run; branch runs finish so each merge saves its compiler cache.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      # Documentation, the website, issue forms, the label list and benchmark rows change no binary.
      - name: Skip builds for documentation-only pull requests
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            if ! printf '%s\n' "$files" |
              grep -qvE '^(docs/.*|site/.*|.*\.md|\.github/ISSUE_TEMPLATE/.*|\.github/labels\.yml|tools/bench/results/.*)$'; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Code needs a changelog entry: a file in changelog.d/ (changelog.d/README.md) or a line under
  # [Unreleased]. Documentation-only pull requests and the bots' branches need none
  # (tools/ci/changelog_fragments.py). HEAD^1 of the merge commit is the tip of the base branch.
  changelog:
    name: Check the changelog entry
    if: github.event_name == 'pull_request' && github.head_ref != 'upstream' && !startsWith(github.head_ref, 'bot/') && !startsWith(github.head_ref, 'merge/upstream')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check for a changelog entry
        run: python3 -I tools/ci/changelog_fragments.py check --base HEAD^1

  linux-gcc:
    name: Linux GCC 13 production build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gcc-13 g++-13 git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache pipx mesa-vulkan-drivers \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtimageformats
          cache: true

      # Objects are keyed by content, so the newest cache of this branch or main always helps;
      # keying it on cpmfile.json threw the whole cache away whenever a dependency changed.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gcc13-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DLICHII_TESTS=ON \
            -DENABLE_QT=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build production and tests
        run: |
          ccache --zero-stats
          start=$(date +%s)
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(nproc)"

      - name: Test debug adapter
        run: python3 tools/nx2/test_debug_mcp.py

      # docs/nx2/gpu-trace.md: the corpus replays headless on Mesa's CPU Vulkan driver.
      - name: Replay GPU traces on lavapipe
        run: |
          python3 tools/nx2/test_trace_replay.py
          # guarana-cli; a build from before the rename has eden-cli.
          cli=build/bin/guarana-cli; [ -x "$cli" ] || cli=build/bin/eden-cli
          python3 -I tools/nx2/trace_replay.py check --cli "$cli" \
            --corpus tests/gpu_traces/corpus.json
      # bench-rows.yml also runs it, and checks contributed result rows, on changes under tools/bench/.
      - name: Test benchmark tool
        run: python3 -I tools/bench/test_bench.py

      - name: Test cache metrics and bench
        run: |
          python3 tools/nx2/test_cache_metrics.py
          python3 tools/nx2/test_cache_bench.py
          python3 tools/nx2/test_cache_records.py

      - name: Test ThreadWorker wake-ups
        run: |
          python3 tools/nx2/test_thread_worker_wake.py
          python3 -I tools/nx2/thread_worker_wake.py --cxx g++-13

      - name: Test offline RADV shader checks
        run: python3 tools/nx2/radv_offline/test_checks.py

      - name: Test Linux switch discovery
        run: CXX=g++-13 python3 tools/nx2/test_switches.py

      # Only pushes save: a pull request's cache could serve only that pull request, and a day of
      # them filled the 10 GB the repository has, which evicted main's and made its next Windows
      # build cold (65 minutes instead of 9). Pull requests restore main's newest instead.
      - name: Save dependencies and compiler objects
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}

      - name: Delete superseded caches
        if: github.ref == 'refs/heads/nx2' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/prune-caches.sh '^gcc13-qt683-${{ runner.os }}-' 'gcc13-qt683-${{ runner.os }}-${{ github.sha }}'

  linux-arm64-nce:
    name: Linux ARM64 NCE build and synthetic guests
    needs: changes
    if: needs.changes.outputs.build == 'true' && (startsWith(github.head_ref, 'capy/nce-') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          test "$(uname -m)" = aarch64
          test "$(getconf PAGESIZE)" = 4096
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf g++-13 git glslang-tools libpulse-dev libtool libudev-dev \
            ninja-build libavfilter-dev libavcodec-dev libswscale-dev pkg-config \
            zlib1g-dev libva-dev libvdpau-dev spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev libopus-dev libasound2-dev ccache pipx
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore ARM64 dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-arm64-nce-${{ github.sha }}
          restore-keys: |
            gcc13-arm64-nce-

      - name: Configure headless build and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DLICHII_TESTS=ON \
            -DENABLE_QT=OFF \
            -DENABLE_OPENGL=OFF \
            -DLICHII_CMD=OFF \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DUSE_CCACHE=ON

      - name: Build and run NCE and JIT tests
        run: |
          cmake --build build --parallel "$(nproc)" --target config_tests arm_cpu_guest_tests
          ctest --test-dir build --output-on-failure --no-tests=error -R '^config_tests$|^arm_cpu_guest_'

      - name: Compare native dispatch with Dynarmic
        run: |
          for backend in nce dynarmic dynarmic nce; do
            build/bin/arm_cpu_guest_tests "$backend" --benchmark
          done

      - name: Save ARM64 dependencies and compiler objects
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-arm64-nce-${{ github.sha }}

  macos-arm64-hypervisor:
    name: Apple Silicon Hypervisor build and signing
    needs: changes
    if: needs.changes.outputs.build == 'true' && startsWith(github.head_ref, 'capy/nce-macos')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          test "$(uname -m)" = arm64
          brew install autoconf automake boost cmake ffmpeg fmt glslang hidapi libtool \
            libusb lz4 molten-vk ninja nlohmann-json openssl pkg-config sdl3 speexdsp \
            spirv-tools vulkan-loader zlib zstd

      - name: Configure headless build and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=ON -DLICHII_TESTS=ON \
            -DENABLE_QT=OFF -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF -DLICHII_ROOM_STANDALONE=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON

      - name: Build and verify both executable signatures
        run: |
          cmake --build build --parallel 3 --target arm_cpu_guest_tests lichii-cmd
          for binary in build/bin/arm_cpu_guest_tests build/bin/eden-cli; do
            codesign --verify --strict "$binary"
            codesign -d --entitlements - "$binary" | grep -F com.apple.security.hypervisor
            if otool -L "$binary" | grep -F /usr/lib/libhvf.dylib; then
              exit 1
            fi
          done
          ctest --test-dir build --output-on-failure --no-tests=error -R '^arm_cpu_guest_dynarmic$'

  windows-clang-cl:
    name: Windows clang-cl production build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      # The test build's artifact is named <APP>-<pr number or branch>-<commit>-windows-x86_64.
      APP: "guarana"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts qtimageformats
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DENABLE_WERROR=ON
          -DBUILD_TESTING=ON
          -DLICHII_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DLICHII_CMD=ON
          -DLICHII_ROOM=OFF
          -DLICHII_ROOM_STANDALONE=OFF
          -DLICHII_USE_BUNDLED_QT=OFF
          -DLICHII_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build production and tests
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          start=$(date +%s)
          cmake --build build --parallel
          ccache --show-stats -v
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"

      # nxformat is linked statically: guarana.exe must not need an nxformat.dll, which Windows
      # may refuse to load (Smart App Control, code integrity policies) or that may be missing.
      # A build from before the rename still produces lichii.exe, so that name is checked too.
      - name: Check guarana.exe does not import nxformat.dll
        run: |
          exe=build/bin/guarana.exe
          [ -f "$exe" ] || exe=build/bin/lichii.exe
          [ -f "$exe" ] || { echo "::error::neither build/bin/guarana.exe nor build/bin/lichii.exe was produced"; exit 1; }
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports "$exe" |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qi ' nxformat.dll$' <<< "$imports"; then
            echo "::error::$(basename "$exe") imports nxformat.dll; nxformat must be linked statically"
            exit 1
          fi

      # Antivirus heuristics count an unsigned program without file metadata against it.
      - name: Check the shipped programs carry a version resource
        run: |
          # guarana.exe and guarana-cli.exe; a build from before the rename has lichii.exe and eden-cli.exe.
          gui=guarana; [ -f "build/bin/$gui.exe" ] || gui=lichii
          cli=guarana-cli; [ -f "build/bin/$cli.exe" ] || cli=eden-cli
          for exe in "$gui" "$cli" lichii-updater; do
            if ! grep -q 'Type: VERSIONINFO' <<< "$("$LLVM_ROOT/bin/llvm-readobj" --coff-resources "build/bin/$exe.exe")"; then
              echo "::error::$exe.exe has no version resource"
              exit 1
            fi
          done

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      # The build a pull request hands to testers: the programs without the unit tests, with the
      # Qt runtime next to them as in the release zips. It is a Release build of this commit (for a
      # pull request, merged into its base) without the release builds' ThinLTO and PGO.
      - name: Name the Windows test build
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then
            label="pr$PR"
          else
            label=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          fi
          echo "TEST_BUILD=$APP-$label-${HEAD_SHA::7}-windows-x86_64" >> "$GITHUB_ENV"

      - name: Package the Windows test build
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'test-build'
          New-Item -ItemType Directory -Force $out | Out-Null
          # guarana.exe and guarana-cli.exe; a build from before the rename has lichii.exe and eden-cli.exe.
          $gui = 'guarana.exe'
          if (-not (Test-Path "build/bin/$gui")) { $gui = 'lichii.exe' }
          $cli = 'guarana-cli.exe'
          if (-not (Test-Path "build/bin/$cli")) { $cli = 'eden-cli.exe' }
          foreach ($exe in $gui, $cli) {
              if (-not (Test-Path "build/bin/$exe")) {
                  throw "build/bin/$exe was not produced"
              }
          }
          # Everything the release zip has, without the test programs and linker by-products.
          Get-ChildItem build/bin -File |
              Where-Object { $_.Name -notmatch '(^|_)tests?\.exe$|_probe\.exe$|fuzzer|\.(pdb|ilk|lib|exp)$' } |
              Copy-Item -Destination $out
          Get-ChildItem build/bin -Directory | Copy-Item -Destination $out -Recurse
          # The patch packs ship next to the programs (FileSys::ShippedPatchPackDirectory).
          if ((Test-Path dist/patch-packs) -and
              -not (Get-ChildItem (Join-Path $out 'patch-packs') -Filter *.json -ErrorAction SilentlyContinue)) {
            throw 'The test build holds no patch pack'
          }
          windeployqt --release --no-translations (Join-Path $out $gui)

      # The folder itself: GitHub zips an artifact on download, and uploading a zip gave a zip
      # inside a zip. pr-build-comment.yml links it on the pull request.
      - name: Upload the Windows test build
        id: test-build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEST_BUILD }}
          path: ${{ runner.temp }}/test-build/
          if-no-files-found: error
          retention-days: 14

      - name: Link the Windows test build
        env:
          URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          echo "Windows test build: [$TEST_BUILD]($URL). Sign in to GitHub to download it; it is kept for 14 days." >> "$GITHUB_STEP_SUMMARY"

      # Only pushes save: a pull request's cache could serve only that pull request, and a day of
      # them filled the 10 GB the repository has, which evicted main's and made its next Windows
      # build cold (65 minutes instead of 9). Pull requests restore main's newest instead.
      - name: Save dependencies and compiler objects
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}

      - name: Delete superseded caches
        if: github.ref == 'refs/heads/nx2' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/prune-caches.sh '^clang-cl-ccache-qt683-${{ runner.os }}-' 'clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}'

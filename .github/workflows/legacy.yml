name: legacy

# The Hall of fame: rebuilds CONTRIBUTORS.md, site/data/legacy.json (the data of site/legacy.html)
# and the avatars between the markers in README.md from the commits of the default branch and
# their Co-authored-by trailers (tools/ci/legacy.py). Bots and AI tools are listed apart, as tools.
#
# publish: daily and on demand. Writes the changed files as one commit on top of the default branch
#   to bot/legacy and opens, updates or closes its pull request, like ingest-reports.yml does for
#   the leaderboard. It commits nothing when the output is already on the default branch. A pull
#   request opened with the repository's token starts no workflows by itself: close and reopen it
#   to run build-check. Needs Settings > Actions > General > Workflow permissions > "Allow GitHub
#   Actions to create and approve pull requests".
# test: the tests of tools/ci on pull requests that change them, the workflows or the agent kit they check.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the output and print what would change, without pushing or touching the pull request
        type: boolean
        default: false
  # The list must cover every file the suite reads.
  pull_request:
    paths:
      - "tools/ci/legacy.py"
      - "tools/ci/build_llms_full.py"
      - "tools/ci/llms-site-facts.txt"
      - "tools/ci/tests/**"
      - "tools/ingest/github_api.py"
      - "tools/ingest/ingest.py"
      - "site/legacy.html"
      - "site/data/legacy.json"
      - ".github/workflows/legacy.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release-binaries.yml"
      - ".github/workflows/launcher.yml"
      - ".github/workflows/nightly.yml"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      # The agent kit that tools/ci/tests/test_agent_kit.py checks.
      - ".github/workflows/agent-claims.yml"
      - ".github/workflows/agents.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/copilot-instructions.md"
      - ".github/labels.yml"
      - "tools/nx2/server.json"
      - "tools/nx2/mcpb_pack.py"
      - "tools/nx2/debug_mcp.py"
      - "docs/agents/**"
      - "HANDOVER.md"
      # The report entry that tools/ci/tests/test_report_destination.py checks.
      - "src/lichii/main_window.cpp"
      - "src/lichii/game/game_list.cpp"
      - "src/lichii/problem_report.cpp"
      - ".github/ISSUE_TEMPLATE/game_bug.yml"
      # The contributor flow that tools/ci/tests/test_contributor_flow.py checks.
      - ".github/workflows/welcome.yml"
      - "CONTRIBUTING.md"
      - "docs/AI-QUICKSTART.md"
      # Every workflow, which test_supply_chain.py reads, and the scripts the other tests import.
      - ".github/workflows/**"
      - "tools/ci/thanks.py"
      - "tools/ci/pr_gate.py"
      - "tools/ci/switch_registry.py"
      - "tools/ci/switch-registry-upstream.txt"
      - "tools/ingest/issue_forms.py"
      - "tools/ingest/tests/fakes.py"
      - "tools/ingest/tests/yaml_subset.py"
      - "tools/nx2/frame_dump_index.py"
      - "tools/nx2/test_*.py"
      - "tools/nx2/radv_offline/test_checks.py"
      - "scripts/run-tests.ps1"
      - "scripts/run-tests.sh"
      # The README markers, the llms-full.txt sources and the sync guide (test_legacy.py,
      # test_build_llms_full.py, test_upstream_sync.py).
      - "README.md"
      - "AGENTS.md"
      - "LEGAL.md"
      - "VERSION"
      - "docs/switches.md"
      - "docs/LANES.md"
      # The credits wiring that tools/ci/tests/test_wiring.py checks.
      - "CONTRIBUTORS.md"
      - "CMakeModules/GuaranaContributors.cmake"
      - "src/lichii/about_dialog.cpp"
      - "src/lichii/CMakeLists.txt"
      - "src/lichii/guarana_contributors.h.in"
      - "launcher/CONTRACT.md"
      - "launcher/src-tauri/build.rs"
      - "launcher/src-tauri/src/credits.rs"
      - "launcher/src-tauri/src/main.rs"
      - "launcher/ui/src/screens/about.ts"

permissions: {}

jobs:
  test:
    name: Test tools/ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the tools/ci tests
        run: python3 -I -m unittest discover -s tools/ci/tests -t tools/ci/tests -v

  publish:
    name: Update the Hall of fame pull request
    if: github.event_name != 'pull_request' && github.repository_owner == 'karimalsalah'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: legacy-publish
      cancel-in-progress: false
    steps:
      # The default branch's code only; the token stays in the checkout for the push.
      - name: Check out
        uses: actions/checkout@v7

      - name: Test the builder
        run: python3 -I tools/ci/tests/test_legacy.py

      - name: Rebuild the Hall of fame and update the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 -I tools/ci/legacy.py publish

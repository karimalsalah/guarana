name: android

# The Android app (src/android): Eden's build script, .ci/android/build.sh, compiles the arm64-v8a
# APK of the mainline flavor with the NDK (Gradle's copyMainlineReleaseOutputs). Pull requests that
# change the app get a check and a test APK. release-binaries.yml calls this for tags and the
# nightly, whose APK is published as guarana-<version>-android-arm64.apk. Nobody on the project has
# an Android device: the APK is compiled here and tested by players (docs/ARM64.md).
#
# Signing: a build that release-binaries.yml asks to sign (`sign`: tags, the nightly and runs on
# main) gets the ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS secrets and is
# signed with the project's release key. Every other build, and every build while those secrets are
# unset, is signed with the debug key committed in src/android, under a .preview id (docs/SIGNING.md).

on:
  pull_request:
    paths:
      - "src/android/**"
      - ".ci/android/**"
      - "src/common/nx2_switch_file.h"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version the app reports
        type: string
        required: true
      build_tag:
        description: LICHII_BUILD_TAG, the tag the build reports
        type: string
        required: true
      channel:
        description: release, nightly or test (release-binaries.yml's prepare job)
        type: string
        required: true
      tag:
        description: The release tag, if any
        type: string
        default: ""
      refspec:
        description: The ref the build reports
        type: string
        required: true
      save_caches:
        description: Save the compiler cache (tags, the nightly and runs on main)
        type: boolean
        default: false
      sign:
        description: Sign with the release key if its secrets are set (tags, the nightly and runs on main)
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  apk:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # A newer push cancels a pull request's run; called and dispatched runs finish.
    concurrency:
      group: android-${{ github.event_name }}-${{ github.ref }}-${{ inputs.sha || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      SHA: ${{ inputs.sha || github.sha }}
      # The test APK of a pull request is named like build-check's Windows one.
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # GetSCMRev (externals/cmake-modules) reads these files instead of asking git, as in
      # release-binaries.yml's builds.
      - name: Write version files
        if: inputs.version
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ inputs.tag }}
          REFSPEC: ${{ inputs.refspec }}
        run: |
          set -euo pipefail
          printf '%s' "$SHA" > GIT-COMMIT
          printf '%s' "$REFSPEC" > GIT-REFSPEC
          printf '%s' "${TAG:-$REFSPEC}" > GIT-TAG
          if [ "$CHANNEL" = release ]; then printf '%s' "$TAG" > GIT-RELEASE; fi

      # The host shaders are compiled with glslangValidator on the build machine.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache glslang-tools

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The versions src/android/app/build.gradle.kts asks for (ndkVersion, externalNativeBuild).
      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;29.0.14206865" "cmake;3.31.5" "build-tools;36.0.0" > /dev/null

      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: android-arm64-ccache-${{ env.SHA }}
          restore-keys: |
            android-arm64-ccache-

      # Maven Central rate-limits the runners (HTTP 429) and a cold Gradle resolution then fails
      # the whole APK. Cache the resolved dependencies and the wrapper between runs.
      - name: Restore Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties', '.ci/android/**') }}
          restore-keys: |
            android-gradle-

      # The nightly has its own app id. Neither channel enables the upstream update checker.
      - name: Build
        env:
          CCACHE: "true"
          NIGHTLY: ${{ inputs.channel == 'nightly' }}
          GIT_TAG_NAME: ${{ inputs.version || format('pr{0}-{1}', github.event.pull_request.number || 'test', github.sha) }}
          # Only a build that release-binaries.yml asks to sign gets the release key. A pull request
          # from a branch of this repository, or a run dispatched by hand, builds code no release has
          # taken yet: it must not run with the key, nor leave a test APK signed with it.
          ANDROID_KEYSTORE_B64: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASS: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_PASS || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.sign && secrets.ANDROID_KEY_ALIAS || '' }}
          BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          set -eu
          ccache --zero-stats
          extra="-DENABLE_UPDATE_CHECKER=OFF -DLICHII_BUILD_PLATFORM=android-arm64"
          if [ -n "$BUILD_TAG" ]; then extra="$extra -DLICHII_BUILD_TAG=$BUILD_TAG"; fi
          # shellcheck disable=SC2086 # the extra arguments are separate words
          sh .ci/android/build.sh -t standard -b Release $extra
          ccache --show-stats

      - name: Save compiler objects
        if: always() && inputs.save_caches && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save Gradle dependencies
        if: always() && inputs.save_caches && steps.gradle-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Name the APK
        id: apk
        env:
          SIGNED: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_B64 != '' }}
          CHANNEL: ${{ inputs.channel || 'test' }}
        run: |
          set -euo pipefail
          apk=artifacts/app-mainline-release.apk
          test -s "$apk" || { echo "::error::$apk was not produced"; ls -la artifacts || true; exit 1; }
          package=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$apk")
          expected=io.github.karimalsalah.guarana
          if [ "$CHANNEL" = nightly ]; then expected+=.nightly; fi
          if [ "$SIGNED" != true ]; then expected+=.preview; fi
          if [ "$package" != "$expected" ]; then
            echo "::error::Expected Android package $expected for $CHANNEL, got $package"
            exit 1
          fi
          mkdir -p out
          if [ -n "$PR" ]; then
            name="guarana-pr$PR-${GITHUB_SHA::10}-android-arm64"
          else
            name="guarana-android-arm64-$GITHUB_SHA"
          fi
          # release-binaries.yml's publish job renames guarana-<commit>-<platform>.apk to
          # guarana-<version>-<platform>.apk.
          cp "$apk" "out/guarana-$GITHUB_SHA-android-arm64.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          key="the public debug key"
          if [ "$SIGNED" = true ]; then key="the release key"; fi
          {
            echo "### Android arm64 APK"
            echo
            echo "\`$name\` ($(du -h "$apk" | cut -f1)), package \`$package\`, signed with $key."
            echo "Never booted on a device by the project: please report how it runs with a device report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.PR != '' && 14 || 7 }}

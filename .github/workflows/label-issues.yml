name: Label issues from form
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body || "";

            // Parse "### Title\n\nanswer" sections into a map
            const sections = {};
            body.split(/^### /m).slice(1).forEach((block) => {
              const [title, ...rest] = block.split("\n");
              sections[title.trim()] = rest.join("\n").trim();
            });
            const get = (k) => {
              const v = sections[k];
              return v && v !== "_No response_" ? v : null;
            };

            const gameLabels = {
              "Ocarina of Time": "Ocarina of Time",
              "The Legend of Zelda: Ocarina of Time": "Ocarina of Time",
              "Mario Kart World": "Mario Kart",
              "Donkey Kong Bananza": "DKB",
              "Kirby Air Riders": "Kirby Air Riders",
              "Pokémon Pokopia": "Pokopia",
              "Pokopia": "Pokopia",
              "Fire Emblem": "Fire Emblem",
              "Splatoon Raiders": "Splatoon Raiders",
              "Hyrule Warriors": "Hyrule Warriors",
              "Mario Tennis Fever": "Mario Tennis Fever",
              "Yoshi and the Mysterious Book": "Yoshi",
              "Welcome Tour": "Welcome Tour",
            };

            const labels = new Set();

            // Game
            const game = get("Game");
            if (game && gameLabels[game]) labels.add(gameLabels[game]);

            // GPU vendor
            const gpu = get("Graphics card");
            if (gpu) {
              if (/nvidia/i.test(gpu)) labels.add("NVIDIA");
              else if (/amd/i.test(gpu)) labels.add("AMD");
              else if (/intel/i.test(gpu)) labels.add("INTEL");

              // The integrated GPUs this fork tunes for (the forms' "Graphics card" options)
              if (/intel/i.test(gpu) && /arc/i.test(gpu)) labels.add("intel-arc");
              if (/amd/i.test(gpu) && /integrated|[0-9]{3}M\b|Z[12]\b/i.test(gpu)) labels.add("amd-igpu");
              if (/handheld/i.test(gpu)) labels.add("handheld");
            }

            // Device reports
            if (/handheld/i.test(get("Form factor") || "")) labels.add("handheld");

            // OS
            const os = get("Operating system");
            if (os) {
              if (/windows/i.test(os)) labels.add("windows");
              else if (/linux|steamos/i.test(os)) labels.add("linux");
              else if (/macos/i.test(os)) labels.add("MacOS");
            }

            // Regression
            if (/- \[x\] This is a regression/i.test(sections["Regression"] || "")) {
              labels.add("regression");
            }
            if (get("Last known working build")) labels.add("needs-bisect");

            // A crash without a log is asked for once, by the triage workflow (tools/ingest/triage.py).

            if (labels.size) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });
            }

# Labels of this repository. .github/workflows/labels.yml creates them and keeps their colour
# and description in step with this file on every push to main that changes it. It never deletes
# or renames a label: to rename one, rename it in the GitHub UI, then here.
# Colours are 6 hex digits without "#", quoted so YAML keeps them as text. Descriptions: 100
# characters at most.

# Work and contribution
- name: agent-ready
  color: "5319e7"
  description: "Scoped for an AI agent (or anyone): goal, files, acceptance test and measurement are in the issue"
- name: good first issue
  color: "7057ff"
  description: "Small and well defined: a good first contribution"
- name: help wanted
  color: "008672"
  description: "Maintainers would welcome a pull request for this"
- name: needs-triage
  color: "ededed"
  description: "Not looked at by a maintainer yet"
- name: claimed
  color: "bfdadc"
  description: "Someone is on it: /claim and /unclaim (docs/agents/README.md); released after 72 h without a PR"
- name: needs-device-data
  color: "fbca04"
  description: "Needs measurements from hardware the maintainers do not have"
- name: device-report
  color: "c5def5"
  description: "How a build runs on one device: fps, frame times, settings"

# Topics
- name: perf
  color: "d93f0b"
  description: "Performance: fps, GPU or CPU time"
- name: stutter
  color: "e99695"
  description: "Hitches and frame time spikes"
- name: frame-pacing
  color: "f9d0c4"
  description: "Uneven frame times, cadence, frame generation pacing"
- name: shader-cache
  color: "bfd4f2"
  description: "Shader and pipeline compilation, caches, warm-up"
- name: boot-time
  color: "d4c5f9"
  description: "Time from launch to gameplay"

# Hardware
- name: intel-arc
  color: "0071c5"
  description: "Intel Arc GPUs; integrated first: 140T, 140V, Meteor Lake, Panther Lake"
- name: amd-igpu
  color: "b8001f"
  description: "AMD Radeon integrated GPUs: 780M, 880M, 890M, Z1 and Z2 handhelds"
- name: handheld
  color: "1d76db"
  description: "Handheld PCs: power limits, battery, small screens"

# Lanes and kinds of change
- name: upstream-port
  color: "0e8a16"
  description: "A port from or to zortos293/Lichii; credit the original author"
- name: hotfix
  color: "b60205"
  description: "Fix for a release branch (hotfix/*), forward-ported to main"
- name: experiment
  color: "fef2c0"
  description: "Behind a default-off EDEN_NX2_* switch; no verified gain yet"
- name: docs
  color: "0075ca"
  description: "Documentation"
- name: ci
  color: "a2eeef"
  description: "Workflows, builds and release packaging"
- name: dependencies
  color: "0366d6"
  description: "Dependency updates, most of them from Dependabot (.github/dependabot.yml)"
- name: legal
  color: "000000"
  description: "Licensing, trademarks, takedown requests, prohibited content"


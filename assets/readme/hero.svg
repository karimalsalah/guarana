<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Guarana</title>
  <desc id="d">Guarana: Switch 2 emulation, tuned for the GPU you actually have. The Guarana mark and name above a horizon, with a row of display slots that light up one after another at an even pace.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .wm { font-size: 132px; font-weight: 800; letter-spacing: -4px; }
    .tag { font-size: 27px; font-weight: 500; fill: #c3c8d1; }
    .meta { font-size: 15px; font-weight: 700; letter-spacing: 3.4px; fill: #949cab; }
    .g1 { animation: d1 16s ease-in-out infinite alternate; }
    .g2 { animation: d2 21s ease-in-out infinite alternate; }
    .g3 { animation: d3 26s ease-in-out infinite alternate; }
    .p { fill: #ffc94a; opacity: 0; animation: rise linear infinite; }
    .sweep { animation: sweep 6s cubic-bezier(.6,0,.3,1) infinite; }
    .sweepw { animation: sweepw 7s cubic-bezier(.6,0,.3,1) .6s infinite; }
    .echo { animation: echo 3s ease-in-out infinite; }
    .mark { animation: bob 8s ease-in-out infinite; }
    .lit { opacity: 0; animation: lit 2.4s linear infinite; }
    .head { animation: head 2.4s linear infinite; }
    .in1 { animation: up 1.1s ease-out both; }
    .in2 { animation: up 1.1s .2s ease-out both; }
    .in3 { animation: up 1.1s .4s ease-out both; }
    .in4 { animation: show 1.6s .8s ease-out both; }
    @keyframes d1 { from { transform: translate(-60px, 10px); } to { transform: translate(70px, -14px); } }
    @keyframes d2 { from { transform: translate(50px, -10px); } to { transform: translate(-80px, 16px); } }
    @keyframes d3 { from { transform: translate(-30px, 0); } to { transform: translate(40px, -8px); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: .7; } 85% { opacity: .2; } 100% { opacity: 0; transform: translate(var(--dx), -250px); } }
    @keyframes sweep { 0% { transform: translateX(-12px); } 45%, 100% { transform: translateX(30px); } }
    @keyframes sweepw { 0% { transform: translateX(-260px); } 50%, 100% { transform: translateX(760px); } }
    @keyframes echo { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes lit { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes head { from { transform: translateX(0); } to { transform: translateX(1184px); } }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .p, .lit, .head { opacity: 0; } }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Guarana</title>
  <desc id="d">Guarana: Switch 2 emulation, tuned for the GPU you actually have.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .wm { font-size: 124px; font-weight: 800; letter-spacing: -3px; fill: #eceef1; }
    .tag { font-size: 25px; font-weight: 500; fill: #c3c8d1; }
    .meta { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; fill: #a3aab6; }
    .g1 { animation: drift1 14s ease-in-out infinite alternate; }
    .g2 { animation: drift2 18s ease-in-out infinite alternate; }
    .g3 { animation: drift3 22s ease-in-out infinite alternate; }
    .p { fill: #ffc94a; opacity: 0; animation: rise linear infinite; }
    .sweep { animation: sweep 6s cubic-bezier(.6,0,.3,1) infinite; }
    .sweepw { animation: sweepw 6s cubic-bezier(.6,0,.3,1) infinite; animation-delay: .35s; }
    .echo { animation: echo 3s ease-in-out infinite; }
    .mark { animation: bob 7s ease-in-out infinite; }
    .scan { stroke-dasharray: 90 1190; animation: scan 5s linear infinite; }
    .in1 { animation: fadeup 1.1s ease-out both; }
    .in2 { animation: fadeup 1.1s .25s ease-out both; }
    .in3 { animation: fadeup 1.1s .5s ease-out both; }
    @keyframes drift1 { from { transform: translate(-60px, 10px); } to { transform: translate(70px, -14px); } }
    @keyframes drift2 { from { transform: translate(50px, -10px); } to { transform: translate(-80px, 16px); } }
    @keyframes drift3 { from { transform: translate(-30px, 0); } to { transform: translate(40px, -8px); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: .7; } 85% { opacity: .35; } 100% { opacity: 0; transform: translate(var(--dx), -230px); } }
    @keyframes sweep { 0% { transform: translateX(-12px); } 45%, 100% { transform: translateX(30px); } }
    @keyframes sweepw { 0% { transform: translateX(-200px); } 45%, 100% { transform: translateX(640px); } }
    @keyframes echo { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes scan { to { stroke-dashoffset: -1280; } }
    @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .p { opacity: .3; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0f13"/><stop offset="1" stop-color="#171b25"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#ffb020" stop-opacity=".34"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#f2851a" stop-opacity=".26"/><stop offset="1" stop-color="#f2851a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc"><stop offset="0" stop-color="#2fbf71" stop-opacity=".14"/><stop offset="1" stop-color="#2fbf71" stop-opacity="0"/></radialGradient>
    <linearGradient id="fill" x1="22" y1="19" x2="48" y2="53" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC94A"/><stop offset="1" stop-color="#F2851A"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2851A" stop-opacity="0"/><stop offset=".5" stop-color="#FFC94A"/><stop offset="1" stop-color="#F2851A" stop-opacity="0"/></linearGradient>
    <mask id="streaks" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><path d="M-4 29.2H29M-4 42.8H29" stroke="#000" stroke-width="3.2" stroke-linecap="round"/></mask>
    <mask id="dropmask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M4 36L26.97 21.6A17 17 0 1 1 26.97 50.4Z" fill="#fff" mask="url(#streaks)"/></mask>
    <clipPath id="wmclip"><text class="wm" x="396" y="214">Guarana</text></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>

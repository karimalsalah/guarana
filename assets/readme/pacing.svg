<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="t d">
  <title id="t">Frames on screen on time, Hyrule Field: old setup against v20.3 defaults</title>
  <desc id="d">Ocarina of Time, Hyrule Field, on a Core Ultra 9 285H with an Arc 140T, Intel driver 32.0.101.9175 and a 120 Hz OLED, on a scale of 0 to 100%. Old setup: about 45-47% of frames on screen on time, and about 200 frames per 10 s flipped late, because the screen copy waited behind about 24 ms of queued game GPU work. v20.3 defaults: 599 of 600 slots on time in the best run, 531-599 of 600 over two paired rounds, and 0 late flips in both paired rounds. A slot is one 16.7 ms display interval; 10 s hold 600.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .h { font-size: 22px; font-weight: 700; fill: #eef0f3; }
    .sub { font-size: 13px; font-weight: 500; fill: #c3c8d1; }
    .row { font-size: 15px; font-weight: 700; fill: #eef0f3; }
    .vo { font-size: 15px; font-weight: 700; fill: #f59e0b; }
    .vn { font-size: 15px; font-weight: 700; fill: #2fbf71; }
    .cap { font-size: 13px; font-weight: 500; fill: #c3c8d1; }
    .ax { font-size: 11.5px; font-weight: 500; fill: #949cab; }
    .ph { font-size: 13.5px; font-weight: 700; fill: #c3c8d1; }
    .pl { font-size: 12.5px; font-weight: 600; fill: #949cab; }
    .po { font-size: 13px; font-weight: 700; fill: #f59e0b; }
    .zero { font-size: 64px; font-weight: 800; fill: #2fbf71; }
    .fn { font-size: 13px; font-weight: 500; fill: #c3c8d1; }
    .fs { font-size: 12px; font-weight: 500; fill: #949cab; }
    .grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: 1.3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: 1.6s; } .d5 { animation-delay: .35s; }
    .pop { animation: pop .8s 1.7s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0c10"/><stop offset="1" stop-color="#151a24"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="959" height="451" rx="18" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".10"/>
  <text class="h" x="36" y="50">Frames on screen on time</text>
  <text class="sub" x="36" y="76">Ocarina of Time, Hyrule Field · Core Ultra 9 285H · Arc 140T · Intel 32.0.101.9175 · 120 Hz OLED</text>
  <g stroke="#ffffff" stroke-opacity=".075" stroke-width="1">
    <path d="M36 132V276M318 132V276M600 132V276"/>
  </g>
  <text class="row" x="36" y="124">Old setup</text>
  <text class="vo" x="600" y="124" text-anchor="end">about 45-47% of frames on time</text>
  <rect x="36" y="136" width="564" height="28" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect class="grow d2" x="36" y="136" width="265.1" height="28" rx="7" fill="#f59e0b" fill-opacity=".45"/>
  <rect class="grow d1" x="36" y="136" width="253.8" height="28" rx="7" fill="#f59e0b"/>
  <text class="cap" x="36" y="186">about 200 frames per 10 s flipped late</text>
  <text class="row" x="36" y="230">v20.3 defaults</text>
  <text class="vn" x="600" y="230" text-anchor="end">599 of 600 slots on time, best run</text>
  <rect x="36" y="242" width="564" height="28" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect class="grow d4" x="36" y="242" width="563.1" height="28" rx="7" fill="#2fbf71" fill-opacity=".45"/>
  <rect class="grow d3" x="36" y="242" width="499.1" height="28" rx="7" fill="#2fbf71"/>
  <text class="cap" x="36" y="292">531-599 of 600 over two paired rounds, 0 late flips</text>
  <text class="ax" x="36" y="316">0</text>
  <text class="ax" x="600" y="316" text-anchor="end">100%</text>
  <rect x="36" y="330" width="14" height="8" rx="2" fill="#949cab"/>
  <text class="ax" x="56" y="338">low end of the measured range</text>
  <rect x="246" y="330" width="14" height="8" rx="2" fill="#949cab" fill-opacity=".45"/>
  <text class="ax" x="266" y="338">up to the high end</text>
  <rect x="632.5" y="104.5" width="291" height="225" rx="14" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".10"/>
  <text class="ph" x="652" y="134">Frames flipped late, per 10 s</text>
  <text class="pl" x="652" y="170">Old setup</text>
  <text class="po" x="904" y="170" text-anchor="end">about 200</text>
  <rect class="grow d5" x="652" y="180" width="252" height="22" rx="6" fill="#f59e0b"/>
  <text class="pl" x="652" y="236">v20.3 defaults</text>
  <g class="pop">
    <text class="zero" x="648" y="306">0</text>
    <text class="cap" x="698" y="284">in both</text>
    <text class="cap" x="698" y="302">paired rounds</text>
  </g>
  <text class="fn" x="36" y="380">Why: in the old setup the screen copy waited behind about 24 ms of queued game GPU work.</text>
  <text class="fn" x="36" y="402">v20.3 runs the copy on a queue of its own, beside the game's rendering.</text>
  <text class="fs" x="36" y="430">A slot is one 16.7 ms display interval; 10 s hold 600. The old on-time figure counts frames, the v20.3 ones count slots.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Guarana</title>
  <!-- Horizontal lockup: mark + wordmark. The wordmark is live text so Guarana can be substituted.
       After substituting, fit the viewBox width to the text (see README.md) or convert the text to paths. -->
  <style>
    .wordmark { fill: #16181D; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }
    @media (prefers-color-scheme: dark) { .wordmark { fill: #ECEEF1; } }
  </style>
  <defs>
    <linearGradient id="logo-fill" x1="22" y1="19" x2="48" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F2851A"/>
    </linearGradient>
    <mask id="logo-streaks" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M-4 29.2H29M-4 42.8H29" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
    </mask>
  </defs>
  <g>
    <path d="M4 36L26.97 21.6A17 17 0 1 1 26.97 50.4Z" fill="url(#logo-fill)" mask="url(#logo-streaks)"/>
    <path d="M37.5 20Q38.5 10.5 48 9Q47.5 18.5 37.5 20Z" fill="#2FBF71"/>
    <path d="M53.93 22.98A17 17 0 0 1 53.93 49.02" fill="none" stroke="#F59E0B" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="wordmark" x="76" y="45">Guarana</text>
</svg>
